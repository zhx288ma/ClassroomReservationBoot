services:
  mysql:
    image: mysql:8.0
    container_name: classroom-mysql
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: classroom_reservation
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p123456"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    container_name: classroom-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: classroom-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      TZ: Asia/Shanghai
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    image: bitnami/kafka:3.7
    container_name: classroom-kafka
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:19092
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:19092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      ALLOW_PLAINTEXT_LISTENER: "yes"
      TZ: Asia/Shanghai
    ports:
      - "19092:19092"
    volumes:
      - kafka-data:/bitnami/kafka

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.22
    container_name: classroom-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      TZ: Asia/Shanghai
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data

  qdrant:
    image: qdrant/qdrant:v1.14.1
    container_name: classroom-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: classroom-app
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      kafka:
        condition: service_started
      elasticsearch:
        condition: service_started
      qdrant:
        condition: service_started
    restart: unless-stopped
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: classroom_reservation
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: 123456
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CLASSROOM_KAFKA_ENABLED: "true"
      ELASTICSEARCH_URL: http://elasticsearch:9200
      CLASSROOM_ES_ENABLED: "true"
      CLASSROOM_QDRANT_URL: http://qdrant:6333
      CLASSROOM_AGENT_VECTOR_ENABLED: "true"
      CLASSROOM_AGENT_EMBEDDING_ENABLED: ${CLASSROOM_AGENT_EMBEDDING_ENABLED:-false}
      CLASSROOM_AGENT_EMBEDDING_API_KEY: ${CLASSROOM_AGENT_EMBEDDING_API_KEY:-}
      CLASSROOM_AGENT_EMBEDDING_BASE_URL: ${CLASSROOM_AGENT_EMBEDDING_BASE_URL:-}
      CLASSROOM_AGENT_EMBEDDING_MODEL: ${CLASSROOM_AGENT_EMBEDDING_MODEL:-qwen3.7-text-embedding}
      CLASSROOM_AGENT_EMBEDDING_DIMENSIONS: ${CLASSROOM_AGENT_EMBEDDING_DIMENSIONS:-1024}
      CLASSROOM_AGENT_LANGCHAIN_ENABLED: ${CLASSROOM_AGENT_LANGCHAIN_ENABLED:-false}
      CLASSROOM_AGENT_LANGCHAIN_API_KEY: ${CLASSROOM_AGENT_LANGCHAIN_API_KEY:-}
      CLASSROOM_AGENT_LANGCHAIN_BASE_URL: ${CLASSROOM_AGENT_LANGCHAIN_BASE_URL:-https://api.deepseek.com/v1}
      CLASSROOM_AGENT_LANGCHAIN_MODEL: ${CLASSROOM_AGENT_LANGCHAIN_MODEL:-deepseek-chat}
    ports:
      - "8081:8081"

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: classroom-prometheus
    depends_on:
      - app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.3.0
    container_name: classroom-grafana
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"

volumes:
  mysql-data:
  redis-data:
  grafana-data:
  kafka-data:
  elasticsearch-data:
  qdrant-data:
