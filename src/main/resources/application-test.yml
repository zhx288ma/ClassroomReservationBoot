spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:classroom_reservation;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
  redis:
    host: localhost
    port: 6379
  rabbitmq:
    listener:
      simple:
        auto-startup: false
