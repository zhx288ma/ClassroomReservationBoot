global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: classroom-reservation-local
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:8081

  - job_name: classroom-reservation-compose
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - app:8081
